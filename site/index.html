(function(){var built='v=1'.slice(2);try{fetch('./version.txt?'+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).then(function(t){t=t.trim();if(t&&t!==built&&sessionStorage.getItem('tk-hub-reloaded')!==t){sessionStorage.setItem('tk-hub-reloaded',t);location.replace(location.pathname+'?v='+t);}}).catch(function(){});}catch(e){}})();
