plugins { id 'com.android.application' }

def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'ru.mirraskola.game'
    compileSdk 34
    defaultConfig {
        applicationId 'ru.mirraskola.game'
        minSdk 24
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }
    // Подпись: ключ из секрета репозитория ANDROID_KEYSTORE_B64 (см. android/README.md).
    // Без секрета APK подписывается отладочным ключом сборщика — ставится, но обновление поверх может не принять.
    def ks = System.getenv('ANDROID_KEYSTORE_PATH')
    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Игра (папка site/) кладётся в assets/site при сборке
    sourceSets { main { assets.srcDirs = ['../../build-android-assets'] } }
    androidResources { noCompress += ['webp', 'png', 'jpg'] }
}
